\* Line, relay 1 dies, rank following, at most 2 losses in any pattern: loops end (count to the bound), ranks and preferred parents settle, the cut-off nodes end detached. Expected: holds.
\* expect: holds
SPECIFICATION FairSpec
CONSTANTS
    Graph = "line"
    Victim = 1
    Origins = {3}
    MaxLoss = 2
    MaxConsec = 2
    MaxRank = 6
    MaxInc = 3
    Fix3 = "refined"
    Fix5 = "solicit"
    Ghosts = FALSE
    Acks = "frame"
    Follow = TRUE
    Behind = "detach"
    Versions = 1
    Adopt = "any"
    Rejoin = "first"
    Best = FALSE
    Rise = 0
    Thr = "rank"
    IncAdv = FALSE
    LateAck = "none"
    Exhaust = "drop"
    Cut = "none"
    Elig = "none"
PROPERTIES LoopsEnd RanksSettle MP10Live CutOffLive RoutesSettle
